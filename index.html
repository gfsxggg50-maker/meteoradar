<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Радар и молнии Карелии</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
        }

        /* === LOGIN === */
        #login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        .login-box {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .login-box h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #38bdf8;
        }
        .login-box p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 28px;
        }
        .login-box input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 14px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 15px;
            outline: none;
        }
        .login-box input:focus { border-color: #38bdf8; }
        .login-box button {
            width: 100%;
            padding: 13px;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .login-box button:hover { background: #0284c7; }
        .error {
            color: #f87171;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }

        /* === MAIN === */
        #main-screen {
            display: none;
            height: 100vh;
            flex-direction: column;
        }
        .header {
            height: 56px;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid #334155;
            z-index: 1000;
            gap: 8px;
        }
        .header h2 {
            font-size: 16px;
            font-weight: 600;
            color: #38bdf8;
            white-space: nowrap;
        }
        .tabs {
            display: flex;
            gap: 4px;
            background: #0f172a;
            padding: 3px;
            border-radius: 8px;
        }
        .tab-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .tab-btn.active {
            background: #0ea5e9;
            color: white;
        }
        .tab-btn:hover:not(.active) {
            color: #e2e8f0;
        }
        #timestamp {
            font-size: 13px;
            color: #e2e8f0;
            min-width: 110px;
            text-align: center;
        }
        .controls {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .controls button {
            width: 34px;
            height: 34px;
            border: 1px solid #475569;
            border-radius: 7px;
            background: #0f172a;
            color: #e2e8f0;
            cursor: pointer;
            font-size: 14px;
        }
        .controls button:hover {
            background: #334155;
            border-color: #38bdf8;
        }
        .logout-btn {
            background: transparent;
            border: 1px solid #475569;
            color: #94a3b8;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 6px;
        }
        .logout-btn:hover {
            border-color: #f87171;
            color: #f87171;
        }

        #content {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #radar-panel, #lightning-panel {
            position: absolute;
            inset: 0;
            display: none;
        }
        #radar-panel.active, #lightning-panel.active {
            display: block;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        #lightning-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .attribution {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(15, 23, 42, 0.85);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            color: #94a3b8;
            z-index: 1000;
        }
        .attribution a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>
<body>

<!-- Логин -->
<div id="login-screen">
    <div class="login-box">
        <h1>🌧 Радар Карелии</h1>
        <p>Осадки + грозопеленгация</p>
        <input type="text" id="username" placeholder="Логин" autocomplete="username">
        <input type="password" id="password" placeholder="Пароль" autocomplete="current-password">
        <button onclick="tryLogin()">Войти</button>
        <div class="error" id="error">Неверный логин или пароль</div>
    </div>
</div>

<!-- Основной экран -->
<div id="main-screen">
    <div class="header">
        <h2>Карелия</h2>

        <div class="tabs">
            <button class="tab-btn active" id="tab-radar" onclick="switchTab('radar')">Осадки</button>
            <button class="tab-btn" id="tab-lightning" onclick="switchTab('lightning')">Молнии</button>
        </div>

        <span id="timestamp">—</span>

        <div class="controls" id="radar-controls">
            <button onclick="stop(); showFrame(animationPosition - 1)">‹</button>
            <button id="playBtn" onclick="playStop()">▶</button>
            <button onclick="stop(); showFrame(animationPosition + 1)">›</button>
        </div>

        <button class="logout-btn" onclick="logout()">Выйти</button>
    </div>

    <div id="content">
        <!-- Радар -->
        <div id="radar-panel" class="active">
            <div id="map"></div>
            <div class="attribution">
                Данные: <a href="https://www.rainviewer.com/" target="_blank">RainViewer</a>
            </div>
        </div>

        <!-- Молнии (Blitzortung) -->
        <div id="lightning-panel">
            <iframe id="lightning-iframe"
                src="https://map.blitzortung.org/index.php?interactive=1&NavigationControl=1&FullScreenControl=1&Cookies=0&InfoDiv=0&MenuButtonDiv=1&ScaleControl=1&Advertisment=0&MapStyle=0#7/61.78/34.35"
                allowfullscreen>
            </iframe>
            <div class="attribution" style="bottom: 40px;">
                Молнии: <a href="https://www.blitzortung.org/" target="_blank">Blitzortung.org</a> / LightningMaps.org
            </div>
        </div>
    </div>
</div>

<script>
    // ===================== НАСТРОЙКИ =====================
    const LOGIN = "admin";
    const PASSWORD = "karelia";

    const KARELIA_CENTER = [61.78, 34.35]; // Петрозаводск
    const KARELIA_ZOOM = 7;

    const TILE_SIZE = window.devicePixelRatio >= 2 ? 512 : 256;
    const RADAR_OPACITY = 0.75;
    const ANIMATION_DELAY_MS = 600;
    const API_URL = "https://api.rainviewer.com/public/weather-maps.json";

    // ===================== СОСТОЯНИЕ =====================
    let apiData = {};
    let mapFrames = [];
    let animationPosition = 0;
    let animationTimer = false;
    let currentLayer = null;
    let isLoading = false;
    let layerCache = {};
    let map = null;
    let currentTab = 'radar';

    // ===================== ЛОГИН =====================
    function tryLogin() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value;

        if (user === LOGIN && pass === PASSWORD) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'flex';
            initMap();
        } else {
            const error = document.getElementById('error');
            error.style.display = 'block';
            setTimeout(() => error.style.display = 'none', 2500);
        }
    }

    document.getElementById('password').addEventListener('keypress', e => {
        if (e.key === 'Enter') tryLogin();
    });
    document.getElementById('username').addEventListener('keypress', e => {
        if (e.key === 'Enter') tryLogin();
    });

    function logout() {
        stop();
        document.getElementById('main-screen').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        if (map) {
            map.remove();
            map = null;
        }
        layerCache = {};
        currentLayer = null;
    }

    // ===================== ВКЛАДКИ =====================
    function switchTab(tab) {
        currentTab = tab;

        document.getElementById('tab-radar').classList.toggle('active', tab === 'radar');
        document.getElementById('tab-lightning').classList.toggle('active', tab === 'lightning');

        document.getElementById('radar-panel').classList.toggle('active', tab === 'radar');
        document.getElementById('lightning-panel').classList.toggle('active', tab === 'lightning');

        document.getElementById('radar-controls').style.display = tab === 'radar' ? 'flex' : 'none';
        document.getElementById('timestamp').style.display = tab === 'radar' ? 'block' : 'none';

        if (tab === 'radar' && map) {
            setTimeout(() => map.invalidateSize(), 50);
        }
    }

    // ===================== КАРТА РАДАРА =====================
    function initMap() {
        map = L.map('map', {
            maxZoom: 12,
            minZoom: 5
        }).setView(KARELIA_CENTER, KARELIA_ZOOM);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        L.marker(KARELIA_CENTER)
            .addTo(map)
            .bindPopup('<b>Петрозаводск</b><br>Республика Карелия');

        map.on('movestart', clearLayerCache);
        loadApiData();
    }

    // ===================== РАДАР =====================
    function wrapPosition(position) {
        while (position >= mapFrames.length) position -= mapFrames.length;
        while (position < 0) position += mapFrames.length;
        return position;
    }

    function formatTime(timestamp) {
        return new Date(timestamp * 1000).toLocaleString('ru-RU', {
            day: '2-digit', month: '2-digit',
            hour: '2-digit', minute: '2-digit'
        });
    }

    function createRadarLayer(frame) {
        return new L.TileLayer(
            apiData.host + frame.path + '/' + TILE_SIZE + '/{z}/{x}/{y}/2/1_1.png',
            {
                tileSize: 256,
                opacity: 0.001,
                maxNativeZoom: 7,
                maxZoom: 12
            }
        );
    }

    function clearLayerCache() {
        stop();
        for (let pos in layerCache) {
            if (parseInt(pos) !== animationPosition) {
                map.removeLayer(layerCache[pos]);
                delete layerCache[pos];
            }
        }
    }

    function stop() {
        if (animationTimer) {
            clearTimeout(animationTimer);
            animationTimer = false;
            document.getElementById("playBtn").innerHTML = "▶";
            return true;
        }
        return false;
    }

    function play() {
        animationTimer = true;
        document.getElementById("playBtn").innerHTML = "⏸";
        showFrame(animationPosition + 1);
    }

    function playStop() {
        if (!stop()) play();
    }

    function updateTimestamp(frame) {
        document.getElementById("timestamp").innerHTML = formatTime(frame.time);
    }

    function showFrame(position) {
        if (isLoading || !mapFrames.length) return;

        position = wrapPosition(position);
        const frame = mapFrames[position];
        updateTimestamp(frame);

        const oldLayer = currentLayer;

        if (layerCache[position]) {
            if (oldLayer) oldLayer.setOpacity(0);
            layerCache[position].setOpacity(RADAR_OPACITY);
            currentLayer = layerCache[position];
            animationPosition = position;
            if (animationTimer) animationTimer = setTimeout(play, ANIMATION_DELAY_MS);
            return;
        }

        isLoading = true;
        const newLayer = createRadarLayer(frame);

        newLayer.on('load', function () {
            newLayer.setOpacity(RADAR_OPACITY);
            if (oldLayer) oldLayer.setOpacity(0);
            layerCache[position] = newLayer;
            currentLayer = newLayer;
            animationPosition = position;
            isLoading = false;
            if (animationTimer) animationTimer = setTimeout(play, ANIMATION_DELAY_MS);
        });

        newLayer.addTo(map);
    }

    function initialize(api) {
        clearLayerCache();
        currentLayer = null;
        mapFrames = [];
        animationPosition = 0;

        if (!api || !api.radar || !api.radar.past) {
            document.getElementById("timestamp").innerHTML = "Нет данных";
            return;
        }

        mapFrames = api.radar.past;
        showFrame(mapFrames.length - 1);
    }

    function loadApiData() {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", API_URL, true);
        xhr.onload = function () {
            if (xhr.status === 200) {
                apiData = JSON.parse(xhr.response);
                initialize(apiData);
            } else {
                document.getElementById("timestamp").innerHTML = "Ошибка";
            }
        };
        xhr.onerror = () => document.getElementById("timestamp").innerHTML = "Нет связи";
        xhr.send();
    }
</script>
</body>
</html>
