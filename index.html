<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МЕТЕОРАДАР</title>
    <style>
        /* --- Полный сброс --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0e17;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /* --- Экран пароля --- */
        #password-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 14, 23, 0.97);
            backdrop-filter: blur(14px);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 24px;
            z-index: 99999;
            color: white;
            padding: 20px;
        }
        #password-screen h1 {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 6px;
            color: #8ab4f8;
            text-shadow: 0 0 60px rgba(138,180,248,0.1);
        }
        #password-screen .subtitle {
            color: rgba(255,255,255,0.3);
            font-size: 16px;
            letter-spacing: 2px;
        }
        #password-screen input {
            padding: 16px 32px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 20px;
            width: 280px;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }
        #password-screen input:focus {
            border-color: #8ab4f8;
            box-shadow: 0 0 40px rgba(138,180,248,0.06);
        }
        #password-screen button {
            padding: 16px 56px;
            border-radius: 50px;
            border: none;
            background: #8ab4f8;
            color: #0a0e17;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        #password-screen button:hover {
            background: #6a9fe0;
            transform: scale(1.03);
        }
        #password-error {
            color: #f28b82;
            font-size: 14px;
            height: 24px;
        }

        /* --- Контейнер карты --- */
        #map-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: none;
        }
        #map-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* --- Название станции (сверху слева) --- */
        .station-name {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            color: rgba(255,255,255,0.15);
            font-size: 12px;
            letter-spacing: 2px;
            pointer-events: none;
            text-transform: uppercase;
        }

        /* --- Панель источников гроз (сверху справа) --- */
        .source-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(10, 14, 23, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 14px 18px;
            border: 1px solid rgba(255,255,255,0.06);
            color: #e8edf5;
            font-size: 12px;
            min-width: 120px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .source-panel h4 {
            font-size: 10px;
            font-weight: 600;
            color: #8ab4f8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding-bottom: 6px;
        }
        .source-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: 0.2s;
        }
        .source-item:hover { color: #fff; }

            width: 8px;
            height: 8px;
