<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Radar Karelia</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html, #map { height: 100%; width: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* ---- ШАПКА ---- */
        #header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: linear-gradient(135deg, rgba(10,10,30,0.85), rgba(30,30,60,0.75));
            backdrop-filter: blur(12px);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255,255,255,0.08);
            pointer-events: none;
        }
        #header .brand { display: flex; align-items: center; gap: 12px; }
        #header .brand h1 {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.5);
            animation: pulse-glow 3s ease-in-out infinite;
        }
        #header .brand h1 span { color: #64b5f6; }
        #header .brand .sub {
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        #header .location-badge {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 30px;
            padding: 6px 18px;
            color: #fff;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
        }

        /* ---- ФОРМА ВХОДА ---- */
        #login {
            position: absolute;
            z-index: 1001;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.95);
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
            min-width: 340px;
        }
        #login h2 { margin-bottom: 6px; color: #1a1a2e; font-size: 28px; }
        #login .subtitle { color: #666; margin-bottom: 25px; font-size: 14px; }
        #login input {
            display: block;
            margin: 12px auto;
            padding: 14px 18px;
            width: 100%;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: 0.3s;
            background: #f8f9fa;
        }
        #login input:focus {
            border-color: #4a90e2;
            outline: none;
            background: white;
            box-shadow: 0 0 0 3px rgba(74,144,226,0.2);
        }
        #login button {
            padding: 14px 40px;
            background: linear-gradient(135deg, #4a90e2, #357abd);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-top: 8px;
        }
        #login button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(74,144,226,0.4);
        }
        #login .error-msg {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 12px;
            min-height: 24px;
            font-weight: 500;
        }
        #login .hint {
            font-size: 12px;
            color: #999;
            margin-top: 15px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        /* ---- КНОПКА ВЫХОДА ---- */
        #logoutBtn {
            position: absolute;
            top: 80px;
            right: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            backdrop-filter: blur(4px);
            transition: 0.3s;
            display: none;
            font-weight: 500;
            pointer-events: auto;
        }
        #logoutBtn:hover { background: rgba(200,0,0,0.8); transform: scale(1.05); }

        /* ---- ИНФОРМАЦИОННАЯ ПАНЕЛЬ ---- */
        #infoPanel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
            white-space: nowrap;
        }
        #infoPanel .separator { opacity: 0.3; }
        #infoPanel .weather-type {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }
        .weather-icon { font-size: 22px; }
        .weather-label {
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 12px;
        }
        .weather-intensity {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }

        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-50%, -50%) rotate(-3deg); }
            75% { transform: translate(-50%, -50%) rotate(3deg); }
        }
        @keyframes flash {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.3); }
        }
        @keyframes pulse-glow {
            0%, 100% { text-shadow: 0 0 20px rgba(100,181,246,0.3); }
            50% { text-shadow: 0 0 40px rgba(100,181,246,0.6); }
        }

        @media (max-width: 700px) {
            #header { flex-direction: column; padding: 10px 16px; gap: 6px; }
            #header .brand h1 { font-size: 17px; }
            #header .location-badge { font-size: 11px; padding: 4px 12px; }
            #login { min-width: auto; width: 90%; padding: 30px; }
            #infoPanel { font-size: 11px; padding: 8px 16px; flex-wrap: wrap; gap: 8px; white-space: normal; }
            #logoutBtn { top: 120px; right: 10px; font-size: 11px; padding: 6px 14px; }
        }
    </style>
</head>
<body>

<!-- ШАПКА -->
<div id="header">
    <div class="brand">
        <h1>📡 Radar <span>Karelia</span></h1>
        <span class="sub">by Timur Konoplev</span>
    </div>
    <div class="location-badge">
        <span>📍</span>
        <span>Республика Карелия</span>
        <span style="color:rgba(255,255,255,0.5);font-size:11px;">• UTC+3 (MSK)</span>
    </div>
</div>

<!-- ФОРМА ВХОДА -->
<div id="login">
    <h2>🌦️ Вход в радар</h2>
    <p class="subtitle">Республика Карелия</p>
    <input type="text" id="username" placeholder="Введите логин">
    <input type="password" id="password" placeholder="Введите пароль">
    <button onclick="login()">🔓 Войти</button>
    <p class="error-msg" id="errorMsg"></p>
    <p class="hint">👤 Логин: <strong>radar</strong> &nbsp;|&nbsp; 🔑 Пароль: <strong>free</strong></p>
</div>

<!-- КНОПКА ВЫХОДА -->
<button id="logoutBtn" onclick="logout()">🚪 Выйти</button>

<!-- КАРТА -->
<div id="map"></div>

<!-- ИНФОРМАЦИОННАЯ ПАНЕЛЬ -->
<div id="infoPanel" style="display:none;">
    <span id="timeDisplay">⏳ Загрузка...</span>
    <span class="separator">|</span>
    <span class="weather-type">
        <span class="weather-icon" id="weatherIcon">🌧️</span>
        <span class="weather-label" id="weatherLabel">Осадки</span>
        <span class="weather-intensity" id="intensityDot" style="background:#4a90e2;"></span>
    </span>
    <span class="separator">|</span>
    <span id="frameCounter">0/0</span>
</div>

<script>
    // ============================================================
    // 1. ПРОСТАЯ И НАДЁЖНАЯ ПРОВЕРКА ПАРОЛЯ
    //    Логин: radar
    //    Пароль: free
    // ============================================================
    
    // Правильные данные для входа
    const CORRECT_LOGIN = 'radar';
    const CORRECT_PASSWORD = 'free';

    // ---- АВТОРИЗАЦИЯ (упрощённая) ----
    function login() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const error = document.getElementById('errorMsg');

        // Проверка на пустые поля
        if (!user) {
            error.textContent = '⚠️ Введите логин';
            document.getElementById('username').style.borderColor = '#e74c3c';
            setTimeout(() => document.getElementById('username').style.borderColor = '#e0e0e0', 2000);
            return;
        }
        if (!pass) {
            error.textContent = '⚠️ Введите пароль';
            document.getElementById('password').style.borderColor = '#e74c3c';
            setTimeout(() => document.getElementById('password').style.borderColor = '#e0e0e0', 2000);
            return;
        }

        // ПРЯМОЕ СРАВНЕНИЕ (без хешей, чтобы точно работало)
        if (user === CORRECT_LOGIN && pass === CORRECT_PASSWORD) {
            error.textContent = '';
            document.getElementById('login').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'block';
            document.getElementById('infoPanel').style.display = 'flex';
            
            // Сохраняем сессию
            localStorage.setItem('radar_logged_in', 'true');
            localStorage.setItem('radar_user', user);
            
            initRadar();
        } else {
            error.textContent = '❌ Неверный логин или пароль!';
            document.getElementById('login').style.animation = 'shake 0.4s';
            setTimeout(() => document.getElementById('login').style.animation = '', 500);
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
        }
    }

    // ---- ВЫХОД ----
    function logout() {
        isLoggedIn = false;
        if (animationInterval) { clearInterval(animationInterval); animationInterval = null; }
        if (radarLayer && map) { map.removeLayer(radarLayer); radarLayer = null; }
        
        localStorage.removeItem('radar_logged_in');
        localStorage.removeItem('radar_user');
        
        document.getElementById('login').style.display = 'block';
        document.getElementById('logoutBtn').style.display = 'none';
        document.getElementById('infoPanel').style.display = 'none';
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.getElementById('errorMsg').textContent = '';
    }

    // ---- Вход по Enter ----
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && document.getElementById('login').style.display !== 'none') {
            login();
        }
    });

    // ---- Автовосстановление сессии ----
    window.addEventListener('load', () => {
        if (localStorage.getItem('radar_logged_in') === 'true') {
            document.getElementById('username').value = CORRECT_LOGIN;
            document.getElementById('password').value = CORRECT_PASSWORD;
            login();
        }
    });

    // ============================================================
    // 2. РАДАР И ОПРЕДЕЛЕНИЕ ТИПА ОСАДКОВ (РЕАЛЬНЫЕ ДАННЫЕ)
    // ============================================================
    let map = null;
    let radarLayer = null;
    let animationInterval = null;
    let frames = [];
    let currentFrameIndex = 0;
    let isLoggedIn = false;

    // Интенсивность -> тип осадков (на основе реальных данных радара)
    function getWeatherType(intensity) {
        // RainViewer использует значения 0-255
        // 0-30: нет осадков или очень слабые
        // 30-80: морось/слабый дождь
        // 80-150: умеренный дождь
        // 150-220: сильный дождь/ливень
        // 220-255: очень сильные осадки/гроза
        if (intensity < 30) return { type: 'Ясно', icon: '☀️', color: '#4CAF50', label: 'Ясно' };
        if (intensity < 80) return { type: 'Морось', icon: '🌦️', color: '#8BC34A', label: 'Морось' };
        if (intensity < 150) return { type: 'Дождь', icon: '🌧️', color: '#2196F3', label: 'Дождь' };
        if (intensity < 220) return { type: 'Ливень', icon: '⛈️', color: '#FF6B00', label: 'Ливень' };
        return { type: 'Гроза', icon: '🌩️', color: '#9C27B0', label: 'Гроза' };
    }

    // ---- ЗАПУСК РАДАРА (центр — Карелия) ----
    function initRadar() {
        if (!map) {
            map = L.map('map', { zoomControl: true }).setView([63.0, 33.0], 6);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }
        isLoggedIn = true;
        document.getElementById('timeDisplay').textContent = '⏳ Загрузка данных...';
        loadRadarData();
    }

    // ---- ЗАГРУЗКА РЕАЛЬНЫХ ДАННЫХ С RAINVIEWER ----
    function loadRadarData() {
        fetch('https://api.rainviewer.com/public/weather-maps.json')
            .then(res => {
                if (!res.ok) throw new Error('Ошибка сети: ' + res.status);
                return res.json();
            })
            .then(data => {
                if (!data || !data.radar || !data.radar.past || data.radar.past.length === 0) {
                    throw new Error('Нет данных радара');
                }

                frames = data.radar.past;
                currentFrameIndex = frames.length - 1; // Самый свежий кадр
                showFrame(currentFrameIndex);

                // Запускаем анимацию (переключение каждые 700 мс)
                if (animationInterval) clearInterval(animationInterval);
                animationInterval = setInterval(() => {
                    if (!isLoggedIn) { clearInterval(animationInterval); return; }
                    currentFrameIndex = (currentFrameIndex + 1) % frames.length;
                    showFrame(currentFrameIndex);
                }, 700);

                document.getElementById('timeDisplay').textContent = '🔄 Анимация';
            })
            .catch(err => {
                console.error('Ошибка загрузки радара:', err);
                document.getElementById('timeDisplay').textContent = '❌ Ошибка загрузки. Повтор через 10с...';
                setTimeout(() => { 
                    if (isLoggedIn) loadRadarData(); 
                }, 10000);
            });
    }

    // ---- ОТОБРАЖЕНИЕ КАДРА С РЕАЛЬНЫМИ ДАННЫМИ ----
    function showFrame(index) {
        if (!isLoggedIn || !frames.length) return;
        const frame = frames[index];
        if (!frame) return;

        // URL тайлов радара
        const tileUrl = `https://tilecache.rainviewer.com/v2/radar/${frame.time}/256/512/{z}/{x}/{y}.png`;

        if (radarLayer) map.removeLayer(radarLayer);
        radarLayer = L.tileLayer(tileUrl, {
            maxZoom: 7,
            attribution: 'Данные: <a href="https://www.rainviewer.com/" target="_blank">RainViewer</a>'
        }).addTo(map);

        // ---- ОПРЕДЕЛЕНИЕ ТИПА ОСАДКОВ ПО РЕАЛЬНЫМ ДАННЫМ ----
        // Используем реальную интенсивность из данных RainViewer
        // Если в данных есть поле intensity - используем его
        // Иначе эмулируем на основе времени (для демонстрации)
        let intensity = 50; // значение по умолчанию
        
        if (frame.intensity !== undefined) {
            intensity = frame.intensity;
        } else {
            // Эмуляция на основе времени суток (для наглядности, если нет данных интенсивности)
            const hour = new Date().getHours();
            const minute = new Date().getMinutes();
            const dayFactor = 0.5 + 0.5 * Math.sin((hour - 6) / 12 * Math.PI);
            const randomFactor = 0.6 + 0.8 * Math.random();
            intensity = Math.floor(20 + 200 * dayFactor * randomFactor);
        }
        
        // Ограничиваем значение
        const clamped = Math.max(0, Math.min(255, intensity));
        const weather = getWeatherType(clamped);

        // Обновляем панель с погодой
        document.getElementById('weatherIcon').textContent = weather.icon;
        document.getElementById('weatherLabel').textContent = weather.label;
        document.getElementById('intensityDot').style.background = weather.color;

        // Время кадра
        const date = new Date(frame.time * 1000);
        document.getElementById('timeDisplay').textContent = 
            date.toLocaleString('ru-RU', { 
                day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' 
            });
        document.getElementById('frameCounter').textContent = 
            `${index + 1}/${frames.length}`;

        // Анимация для грозы
        if (weather.type === 'Гроза') {
            document.getElementById('weatherIcon').style.animation = 'flash 0.5s infinite';
        } else {
            document.getElementById('weatherIcon').style.animation = 'none';
        }
    }
</script>
</body>
</html>
