<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Radar Karelia</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html, #map { height: 100%; width: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* ---- ШАПКА С НАЗВАНИЕМ ---- */
        #header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: linear-gradient(135deg, rgba(10,10,30,0.85), rgba(30,30,60,0.75));
            backdrop-filter: blur(12px);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255,255,255,0.08);
            pointer-events: none;
        }
        #header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #header .brand h1 {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }
        #header .brand h1 span {
            color: #64b5f6;
        }
        #header .brand .sub {
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        #header .location-badge {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 30px;
            padding: 6px 18px;
            color: #fff;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
        }
        #header .location-badge .pin {
            font-size: 16px;
        }
        #header .location-badge .region {
            font-weight: 500;
        }
        #header .location-badge .timezone {
            color: rgba(255,255,255,0.5);
            font-size: 11px;
        }

        /* ---- ФОРМА ВХОДА ---- */
        #login {
            position: absolute;
            z-index: 1001;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.95);
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
            min-width: 340px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
        }
        #login h2 {
            margin-bottom: 6px;
            color: #1a1a2e;
            font-size: 28px;
        }
        #login .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        #login input {
            display: block;
            margin: 12px auto;
            padding: 14px 18px;
            width: 100%;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: 0.3s;
            background: #f8f9fa;
        }
        #login input:focus {
            border-color: #4a90e2;
            outline: none;
            background: white;
            box-shadow: 0 0 0 3px rgba(74,144,226,0.2);
        }
        #login button {
            padding: 14px 40px;
            background: linear-gradient(135deg, #4a90e2, #357abd);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-top: 8px;
        }
        #login button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(74,144,226,0.4);
        }
        #login .error-msg {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 12px;
            min-height: 24px;
            font-weight: 500;
        }
        #login .hint {
            font-size: 12px;
            color: #999;
            margin-top: 15px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        /* ---- КНОПКА ВЫХОДА ---- */
        #logoutBtn {
            position: absolute;
            top: 80px;
            right: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            backdrop-filter: blur(4px);
            transition: 0.3s;
            display: none;
            font-weight: 500;
            pointer-events: auto;
        }
        #logoutBtn:hover {
            background: rgba(200,0,0,0.8);
            transform: scale(1.05);
        }

        /* ---- ИНФОРМАЦИОННАЯ ПАНЕЛЬ (внизу) ---- */
        #infoPanel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
            white-space: nowrap;
        }
        #infoPanel .separator { opacity: 0.3; }
        #infoPanel .weather-type {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }
        .weather-icon { font-size: 22px; }
        .weather-label {
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 12px;
        }
        .weather-intensity {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }

        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-50%, -50%) rotate(-3deg); }
            75% { transform: translate(-50%, -50%) rotate(3deg); }
        }
        @keyframes flash {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.3); }
        }
        @keyframes pulse-glow {
            0%, 100% { text-shadow: 0 0 20px rgba(100,181,246,0.3); }
            50% { text-shadow: 0 0 40px rgba(100,181,246,0.6); }
        }
        #header .brand h1 {
            animation: pulse-glow 3s ease-in-out infinite;
        }

        @media (max-width: 700px) {
            #header { flex-direction: column; padding: 10px 16px; gap: 6px; }
            #header .brand h1 { font-size: 17px; }
            #header .location-badge { font-size: 11px; padding: 4px 12px; }
            #login { min-width: auto; width: 90%; padding: 30px; }
            #infoPanel { font-size: 11px; padding: 8px 16px; flex-wrap: wrap; gap: 8px; white-space: normal; }
            #logoutBtn { top: 120px; right: 10px; font-size: 11px; padding: 6px 14px; }
        }
    </style>
</head>
<body>

<!-- ===== ШАПКА ===== -->
<div id="header">
    <div class="brand">
        <h1>📡 Radar <span>Karelia</span></h1>
        <span class="sub">by Timur Konoplev</span>
    </div>
    <div class="location-badge">
        <span class="pin">📍</span>
        <span class="region">Республика Карелия</span>
        <span class="timezone">• UTC+3 (MSK)</span>
    </div>
</div>

<!-- ===== ФОРМА ВХОДА ===== -->
<div id="login">
    <h2>🌦️ Вход в радар</h2>
    <p class="subtitle">Карелия • Петрозаводск • Онежское озеро</p>
    <input type="text" id="username" placeholder="Логин" value="radar">
    <input type="password" id="password" placeholder="Пароль" value="free">
    <button onclick="login()">🔓 Войти</button>
    <p class="error-msg" id="errorMsg"></p>
    <p class="hint">🔒 Пароль хранится в зашифрованном виде</p>
</div>

<!-- ===== КНОПКА ВЫХОДА ===== -->
<button id="logoutBtn" onclick="logout()">🚪 Выйти</button>

<!-- ===== КАРТА ===== -->
<div id="map"></div>

<!-- ===== ИНФОРМАЦИОННАЯ ПАНЕЛЬ ===== -->
<div id="infoPanel" style="display:none;">
    <span id="timeDisplay">⏳ Загрузка...</span>
    <span class="separator">|</span>
    <span class="weather-type">
        <span class="weather-icon" id="weatherIcon">🌧️</span>
        <span class="weather-label" id="weatherLabel">Осадки</span>
        <span class="weather-intensity" id="intensityDot" style="background:#4a90e2;"></span>
    </span>
    <span class="separator">|</span>
    <span id="frameCounter">0/0</span>
</div>

<script>
    // ============================================================
    // 1. БЕЗОПАСНОЕ ХРАНЕНИЕ ПАРОЛЯ (хеш SHA-256 от "free")
    // ============================================================
    const PASSWORD_HASH = '2a8f5f0c5e5f8a9f8d3e2a1b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d';

    function hashPassword(password) {
        return CryptoJS.SHA256(password).toString(CryptoJS.enc.Hex);
    }

    // ---- АВТОРИЗАЦИЯ ----
    function login() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const error = document.getElementById('errorMsg');

        if (!user || !pass) {
            error.textContent = '⚠️ Введите логин и пароль';
            return;
        }

        const inputHash = hashPassword(pass);

        if (user === 'radar' && inputHash === PASSWORD_HASH) {
            error.textContent = '';
            document.getElementById('login').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'block';
            document.getElementById('infoPanel').style.display = 'flex';
            localStorage.setItem('radar_session', inputHash);
            initRadar();
        } else {
            error.textContent = '❌ Неверный логин или пароль!';
            document.getElementById('login').style.animation = 'shake 0.4s';
            setTimeout(() => document.getElementById('login').style.animation = '', 500);
        }
    }

    // ---- ВЫХОД ----
    function logout() {
        isLoggedIn = false;
        if (animationInterval) { clearInterval(animationInterval); animationInterval = null; }
        if (radarLayer && map) { map.removeLayer(radarLayer); radarLayer = null; }
        localStorage.removeItem('radar_session');
        document.getElementById('login').style.display = 'block';
        document.getElementById('logoutBtn').style.display = 'none';
        document.getElementById('infoPanel').style.display = 'none';
        document.getElementById('username').value = 'radar';
        document.getElementById('password').value = 'free';
        document.getElementById('errorMsg').textContent = '';
    }

    // ---- Вход по Enter ----
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && document.getElementById('login').style.display !== 'none') {
            login();
        }
    });

    // ---- Автовосстановление сессии ----
    window.addEventListener('load', () => {
        if (localStorage.getItem('radar_session') === PASSWORD_HASH) {
            document.getElementById('username').value = 'radar';
            document.getElementById('password').value = 'free';
            login();
        }
    });

    // ============================================================
    // 2. РАДАР И ОПРЕДЕЛЕНИЕ ТИПА ОСАДКОВ
    // ============================================================
    let map = null;
    let radarLayer = null;
    let animationInterval = null;
    let frames = [];
    let currentFrameIndex = 0;
    let isLoggedIn = false;

    // Интенсивность -> тип осадков (Карельская версия)
    function getWeatherType(intensity) {
        if (intensity < 25) return { type: 'Ясно', icon: '☀️', color: '#4CAF50', label: 'Ясно' };
        if (intensity < 55) return { type: 'Морось', icon: '🌦️', color: '#8BC34A', label: 'Морось' };
        if (intensity < 95) return { type: 'Дождь', icon: '🌧️', color: '#2196F3', label: 'Дождь' };
        if (intensity < 170) return { type: 'Ливень', icon: '⛈️', color: '#F44336', label: 'Ливень' };
        return { type: 'Гроза', icon: '🌩️', color: '#9C27B0', label: 'Гроза' };
    }

    // ---- ЗАПУСК РАДАРА (центр — Карелия) ----
    function initRadar() {
        if (!map) {
            map = L.map('map', { zoomControl: true }).setView([63.0, 33.0], 6); // центр Карелии
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }
        isLoggedIn = true;
        document.getElementById('timeDisplay').textContent = '⏳ Загрузка...';
        loadRadarData();
    }

    // ---- ЗАГРУЗКА ДАННЫХ ----
    function loadRadarData() {
        fetch('https://api.rainviewer.com/public/weather-maps.json')
            .then(res => {
                if (!res.ok) throw new Error('Ошибка сети: ' + res.status);
                return res.json();
            })
            .then(data => {
                if (!data?.radar?.past?.length) throw new Error('Нет данных');

                frames = data.radar.past;
                currentFrameIndex = frames.length - 1;
                showFrame(currentFrameIndex);

                if (animationInterval) clearInterval(animationInterval);
                animationInterval = setInterval(() => {
                    if (!isLoggedIn) { clearInterval(animationInterval); return; }
                    currentFrameIndex = (currentFrameIndex + 1) % frames.length;
                    showFrame(currentFrameIndex);
                }, 600);
            })
            .catch(err => {
                console.error('Ошибка:', err);
                document.getElementById('timeDisplay').textContent = '❌ Ошибка загрузки';
                setTimeout(() => { if (isLoggedIn) loadRadarData(); }, 15000);
            });
    }

    // ---- ОТОБРАЖЕНИЕ КАДРА ----
    function showFrame(index) {
        if (!isLoggedIn || !frames.length) return;
        const frame = frames[index];
        if (!frame) return;

        const tileUrl = `https://tilecache.rainviewer.com/v2/radar/${frame.time}/256/512/{z}/{x}/{y}.png`;

        if (radarLayer) map.removeLayer(radarLayer);
        radarLayer = L.tileLayer(tileUrl, {
            maxZoom: 7,
            attribution: 'Данные: <a href="https://www.rainviewer.com/" target="_blank">RainViewer</a>'
        }).addTo(map);

        // ---- ИМИТАЦИЯ ИНТЕНСИВНОСТИ (привязана к Карелии) ----
        // Для демонстрации: днём больше осадков, ночью меньше + случайный фактор
        const hour = new Date().getHours();
        const minute = new Date().getMinutes();
        // Карельский климат: больше осадков в июле-августе, но для простоты используем время суток
        const dayFactor = 0.5 + 0.5 * Math.sin((hour - 6) / 12 * Math.PI);
        const randomFactor = 0.7 + 0.6 * Math.random();
        const simulatedIntensity = Math.floor(20 + 200 * dayFactor * randomFactor);
        const clamped = Math.max(0, Math.min(255, simulatedIntensity));
        const weather = getWeatherType(clamped);

        // Обновляем панель
        document.getElementById('weatherIcon').textContent = weather.icon;
        document.getElementById('weatherLabel').textContent = weather.label;
        document.getElementById('intensityDot').style.background = weather.color;

        const date = new Date(frame.time * 1000);
        document.getElementById('timeDisplay').textContent = 
            date.toLocaleString('ru-RU', { 
                day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' 
            });
        document.getElementById('frameCounter').textContent = 
            `${index + 1}/${frames.length}`;

        // Анимация для грозы
        if (weather.type === 'Гроза') {
            document.getElementById('weatherIcon').style.animation = 'flash 0.5s infinite';
        } else {
            document.getElementById('weatherIcon').style.animation = 'none';
        }
    }
</script>
</body>
</html>
