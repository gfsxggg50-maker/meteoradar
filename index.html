<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Radar Karelia</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html, #map { height: 100%; width: 100%; font-family: Arial, sans-serif; }

        #header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(0, 0, 30, 0.92);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            backdrop-filter: blur(8px);
            pointer-events: none;
            border-bottom: 2px solid rgba(100, 181, 246, 0.3);
        }
        #header h1 { font-size: 20px; font-weight: 700; }
        #header h1 span { color: #64b5f6; }
        #header .sub { font-size: 11px; opacity: 0.6; margin-left: 8px; }
        #header .location { font-size: 13px; opacity: 0.8; }

        #login {
            position: absolute;
            z-index: 1001;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
            min-width: 300px;
        }
        #login h2 { margin-bottom: 5px; color: #1a1a2e; font-size: 26px; }
        #login .subtitle { color: #888; margin-bottom: 25px; font-size: 14px; }
        #login input {
            display: block;
            margin: 10px auto;
            padding: 12px 16px;
            width: 100%;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }
        #login input:focus { border-color: #4a90e2; outline: none; }
        #login button {
            padding: 12px;
            width: 100%;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        #login button:hover { background: #357abd; transform: scale(1.02); }
        #login .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            min-height: 22px;
            font-weight: 500;
        }
        #login .hint {
            font-size: 12px;
            color: #999;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        #login .hint strong {
            color: #333;
            background: #f0f0f0;
            padding: 2px 10px;
            border-radius: 4px;
        }

        #logoutBtn {
            position: absolute;
            top: 80px;
            right: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            display: none;
            transition: 0.2s;
        }
        #logoutBtn:hover { background: #c0392b; }

        #bottomPanel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 14px 24px 18px 24px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-width: 300px;
            max-width: 90%;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: auto;
        }
        #bottomPanel .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
        }
        #bottomPanel .top-row .time-display {
            color: white;
            font-weight: 600;
            font-size: 14px;
        }
        #bottomPanel .top-row .status {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #bottomPanel .top-row .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            background: #4CAF50;
            animation: pulse 1.5s ease-in-out infinite;
        }
        #bottomPanel .top-row .status .dot.paused {
            background: #FF9800;
            animation: none;
        }

        #bottomPanel .timeline {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #bottomPanel .timeline input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(90deg, #4CAF50, #FFEB3B, #FF6B00, #F44336);
            outline: none;
            cursor: pointer;
        }
        #bottomPanel .timeline input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            border: 2px solid #4a90e2;
        }
        #bottomPanel .timeline input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: 2px solid #4a90e2;
        }

        #bottomPanel .timeline .nav-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
            pointer-events: auto;
            line-height: 1;
        }
        #bottomPanel .timeline .nav-btn:hover { background: rgba(255,255,255,0.2); }
        #bottomPanel .timeline .nav-btn:active { transform: scale(0.95); }
        #bottomPanel .timeline .frame-info {
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            min-width: 50px;
            text-align: center;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }
        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-50%, -50%) rotate(-4deg); }
            75% { transform: translate(-50%, -50%) rotate(4deg); }
        }

        @media (max-width: 700px) {
            #header { flex-direction: column; padding: 10px 16px; gap: 4px; }
            #header h1 { font-size: 17px; }
            #login { min-width: auto; width: 90%; padding: 30px; }
            #bottomPanel { min-width: auto; width: 95%; padding: 12px 14px 16px 14px; }
            #bottomPanel .top-row { font-size: 11px; flex-wrap: wrap; gap: 4px; }
            #bottomPanel .top-row .time-display { font-size: 12px; }
            #logoutBtn { top: 110px; right: 10px; font-size: 11px; padding: 6px 14px; }
            #bottomPanel .timeline .nav-btn { padding: 4px 10px; font-size: 14px; }
        }
    </style>
</head>
<body>

<!-- ШАПКА -->
<div id="header">
    <div>
        <h1>📡 Radar <span>Karelia</span></h1>
        <span class="sub">by Timur Konoplev</span>
    </div>
    <div class="location">📍 Республика Карелия</div>
</div>

<!-- ФОРМА ВХОДА -->
<div id="login">
    <h2>🌦️ Вход</h2>
    <p class="subtitle">Радар осадков</p>
    <input type="text" id="loginInput" placeholder="Логин">
    <input type="password" id="passInput" placeholder="Пароль">
    <button onclick="doLogin()">🔓 Войти</button>
    <div class="error" id="errorMsg"></div>
    <div class="hint">
        👤 <strong>radar</strong> / <strong>123</strong> &nbsp;|&nbsp; 🔑 <strong>free</strong> / <strong>123</strong>
    </div>
</div>

<!-- КНОПКА ВЫХОДА -->
<button id="logoutBtn" onclick="doLogout()">🚪 Выйти</button>

<!-- КАРТА -->
<div id="map"></div>

<!-- НИЖНЯЯ ПАНЕЛЬ -->
<div id="bottomPanel">
    <div class="top-row">
        <span class="time-display" id="currentTimeDisplay">⏳ Загрузка...</span>
        <span class="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Загрузка</span>
        </span>
    </div>
    <div class="timeline">
        <button class="nav-btn" onclick="prevFrame()">◀</button>
        <input type="range" id="timelineSlider" min="0" max="0" value="0" oninput="sliderChanged()">
        <button class="nav-btn" onclick="nextFrame()">▶</button>
        <span class="frame-info" id="frameInfo">0/0</span>
    </div>
</div>

<script>
    // ========================================
    // 1. АВТОРИЗАЦИЯ
    // ========================================
    
    const USERS = [
        { login: 'radar', password: 'free' },
        { login: '123', password: '123' }
    ];

    function doLogin() {
        const user = document.getElementById('loginInput').value.trim();
        const pass = document.getElementById('passInput').value.trim();
        const error = document.getElementById('errorMsg');

        if (!user) { error.textContent = '⚠️ Введите логин'; return; }
        if (!pass) { error.textContent = '⚠️ Введите пароль'; return; }

        const found = USERS.find(u => u.login === user && u.password === pass);

        if (found) {
            error.textContent = '';
            document.getElementById('login').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'block';
            document.getElementById('bottomPanel').style.display = 'flex';
            localStorage.setItem('radar_auth', 'ok');
            localStorage.setItem('radar_user', user);
            initRadar();
        } else {
            error.textContent = '❌ Неверный логин или пароль!';
            document.getElementById('login').style.animation = 'shake 0.4s';
            setTimeout(() => document.getElementById('login').style.animation = '', 500);
            document.getElementById('passInput').value = '';
            document.getElementById('passInput').focus();
        }
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && document.getElementById('login').style.display !== 'none') {
            doLogin();
        }
    });

    function doLogout() {
        loggedIn = false;
        if (animTimer) { clearInterval(animTimer); animTimer = null; }
        if (radarLayer && map) { map.removeLayer(radarLayer); radarLayer = null; }
        localStorage.removeItem('radar_auth');
        localStorage.removeItem('radar_user');
        document.getElementById('login').style.display = 'block';
        document.getElementById('logoutBtn').style.display = 'none';
        document.getElementById('bottomPanel').style.display = 'none';
        document.getElementById('loginInput').value = '';
        document.getElementById('passInput').value = '';
        document.getElementById('errorMsg').textContent = '';
    }

    window.addEventListener('load', function() {
        if (localStorage.getItem('radar_auth') === 'ok') {
            const savedUser = localStorage.getItem('radar_user') || 'radar';
            const savedPass = savedUser === 'radar' ? 'free' : '123';
            document.getElementById('loginInput').value = savedUser;
            document.getElementById('passInput').value = savedPass;
            doLogin();
        }
    });

    // ========================================
    // 2. РАДАР - MET NORWAY
    // ========================================
    
    let map = null;
    let radarLayer = null;
    let animTimer = null;
    let frames = [];
    let currentIndex = 0;
    let loggedIn = false;
    let isPlaying = true;

    function initRadar() {
        if (!map) {
            map = L.map('map', {
                center: [63.0, 33.0],
                zoom: 6,
                zoomControl: true
            });
            
            // Тёмная карта для лучшей видимости
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap, © CartoDB',
                maxZoom: 19
            }).addTo(map);
        }
        loggedIn = true;
        document.getElementById('statusText').textContent = 'Загрузка...';
        loadRadarData();
    }

    function loadRadarData() {
        // Используем MET Norway Radar API
        // Получаем список доступных кадров за последние 3 часа
        fetch('https://api.met.no/weatherapi/radar/2.0/available.json')
            .then(response => {
                if (!response.ok) throw new Error('Ошибка MET API');
                return response.json();
            })
            .then(data => {
                if (!data || !data.files || data.files.length === 0) {
                    throw new Error('Нет данных');
                }
                
                // Берём последние 10 кадров (примерно за последние 2-3 часа)
                const radarFiles = data.files
                    .filter(f => f.type === 'PNG')
                    .filter(f => f.product === 'compressed' || f.product === 'polar')
                    .slice(-10);
                
                if (radarFiles.length === 0) {
                    throw new Error('Нет PNG файлов');
                }
                
                frames = radarFiles.map(f => ({
                    time: f.time,
                    path: f.path,
                    area: f.area
                }));
                
                currentIndex = frames.length - 1;
                
                const slider = document.getElementById('timelineSlider');
                slider.max = frames.length - 1;
                slider.value = currentIndex;
                
                showFrame(currentIndex);
                updateTimelineInfo();
                
                // Запускаем анимацию
                if (animTimer) clearInterval(animTimer);
                animTimer = setInterval(() => {
                    if (!loggedIn) { clearInterval(animTimer); return; }
                    if (isPlaying) {
                        if (currentIndex < frames.length - 1) {
                            currentIndex++;
                        } else {
                            // Если дошли до конца - перематываем к последнему
                            // Можно оставить на последнем
                        }
                        showFrame(currentIndex);
                        document.getElementById('timelineSlider').value = currentIndex;
                        updateTimelineInfo();
                    }
                }, 1500);
            })
            .catch(err => {
                console.error('MET Radar ошибка:', err);
                document.getElementById('statusText').textContent = '❌ Ошибка MET API';
                // Пробуем другой источник
                loadRadarDataBackup();
            });
    }

    // Резервный вариант - если MET не работает
    function loadRadarDataBackup() {
        document.getElementById('statusText').textContent = '⏳ Резервный источник...';
        
        // Используем RainViewer через прокси с правильным форматом
        fetch('https://api.rainviewer.com/public/weather-maps.json')
            .then(r => r.json())
            .then(data => {
                if (!data || !data.radar || !data.radar.past) {
                    throw new Error('Нет данных');
                }
                
                // Берём последние 8 кадров
                const allFrames = data.radar.past;
                frames = allFrames.slice(-8);
                currentIndex = frames.length - 1;
                
                const slider = document.getElementById('timelineSlider');
                slider.max = frames.length - 1;
                slider.value = currentIndex;
                
                showFrameBackup(currentIndex);
                updateTimelineInfo();
                
                if (animTimer) clearInterval(animTimer);
                animTimer = setInterval(() => {
                    if (!loggedIn) { clearInterval(animTimer); return; }
                    if (isPlaying) {
                        currentIndex = (currentIndex + 1) % frames.length;
                        showFrameBackup(currentIndex);
                        document.getElementById('timelineSlider').value = currentIndex;
                        updateTimelineInfo();
                    }
                }, 800);
            })
            .catch(err => {
                console.error('Ошибка:', err);
                document.getElementById('statusText').textContent = '❌ Ошибка загрузки';
                document.getElementById('currentTimeDisplay').textContent = '❌ Нет данных';
            });
    }

    // === MET Norway Frame ===
    function showFrame(index) {
        if (!loggedIn || !frames.length) return;
        const frame = frames[index];
        if (!frame) return;

        // MET Norway Radar URL
        // Используем их CDN с правильными параметрами
        const baseUrl = 'https://api.met.no/weatherapi/radar/2.0';
        const tileUrl = `${baseUrl}/tile/${frame.area}/${frame.time}/512/{z}/{x}/{y}.png`;

        if (radarLayer) {
            map.removeLayer(radarLayer);
        }

        radarLayer = L.tileLayer(tileUrl, {
            maxZoom: 10,
            minZoom: 4,
            opacity: 0.8,
            attribution: 'Данные: MET Norway',
            tms: false
        }).addTo(map);

        // Обновляем информацию
        const d = new Date(frame.time * 1000);
        const timeStr = d.toLocaleString('ru-RU', { 
            day: '2-digit', 
            month: '2-digit', 
            hour: '2-digit', 
            minute: '2-digit' 
        });
        
        document.getElementById('currentTimeDisplay').textContent = timeStr;
        
        const now = Date.now() / 1000;
        const diffMinutes = Math.round((now - frame.time) / 60);
        if (diffMinutes < 5) {
            document.getElementById('statusText').textContent = '🟢 Сейчас';
            document.getElementById('statusDot').className = 'dot';
        } else {
            document.getElementById('statusText').textContent = `🟡 ${diffMinutes} мин назад`;
            document.getElementById('statusDot').className = 'dot paused';
        }
        document.getElementById('frameInfo').textContent = `${index + 1}/${frames.length}`;
    }

    // === RainViewer Frame (резерв) ===
    function showFrameBackup(index) {
        if (!loggedIn || !frames.length) return;
        const frame = frames[index];
        if (!frame) return;

        // Правильный URL для RainViewer на zoom 5-6
        const tileUrl = `https://tilecache.rainviewer.com/v2/radar/${frame.time}/256/{z}/{x}/{y}/2/1_1.png`;

        if (radarLayer) {
            map.removeLayer(radarLayer);
        }

        radarLayer = L.tileLayer(tileUrl, {
            maxZoom: 7,
            minZoom: 3,
            opacity: 0.8,
            attribution: 'Данные: RainViewer',
            tms: false
        }).addTo(map);

        const d = new Date(frame.time * 1000);
        const timeStr = d.toLocaleString('ru-RU', { 
            day: '2-digit', 
            month: '2-digit', 
            hour: '2-digit', 
            minute: '2-digit' 
        });
        
        document.getElementById('currentTimeDisplay').textContent = timeStr;
        document.getElementById('statusText').textContent = index === frames.length - 1 ? '🟢 Сейчас' : '🟡 Прошлое';
        document.getElementById('statusDot').className = index === frames.length - 1 ? 'dot' : 'dot paused';
        document.getElementById('frameInfo').textContent = `${index + 1}/${frames.length}`;
    }

    function updateTimelineInfo() {
        if (!frames.length) return;
        const frame = frames[currentIndex];
        if (!frame) return;
        
        const d = new Date(frame.time * 1000);
        const timeStr = d.toLocaleString('ru-RU', { 
            day: '2-digit', 
            month: '2-digit', 
            hour: '2-digit', 
            minute: '2-digit' 
        });
        document.getElementById('currentTimeDisplay').textContent = timeStr;
        document.getElementById('frameInfo').textContent = `${currentIndex + 1}/${frames.length}`;
    }

    // ---- УПРАВЛЕНИЕ ТАЙМЛАЙНОМ ----
    function sliderChanged() {
        const slider = document.getElementById('timelineSlider');
        const val = parseInt(slider.value);
        if (val >= 0 && val < frames.length) {
            currentIndex = val;
            if (frames[currentIndex].area) {
                showFrame(currentIndex);
            } else {
                showFrameBackup(currentIndex);
            }
            isPlaying = false;
            document.getElementById('statusText').textContent = '⏸️ Пауза';
            document.getElementById('statusDot').className = 'dot paused';
        }
    }

    function prevFrame() {
        if (currentIndex > 0) {
            currentIndex--;
            document.getElementById('timelineSlider').value = currentIndex;
            if (frames[currentIndex].area) {
                showFrame(currentIndex);
            } else {
                showFrameBackup(currentIndex);
            }
            isPlaying = false;
            document.getElementById('statusText').textContent = '⏸️ Пауза';
            document.getElementById('statusDot').className = 'dot paused';
        }
    }

    function nextFrame() {
        if (currentIndex < frames.length - 1) {
            currentIndex++;
            document.getElementById('timelineSlider').value = currentIndex;
            if (frames[currentIndex].area) {
                showFrame(currentIndex);
            } else {
                showFrameBackup(currentIndex);
            }
            isPlaying = false;
            document.getElementById('statusText').textContent = '⏸️ Пауза';
            document.getElementById('statusDot').className = 'dot paused';
        }
    }

    // ---- КНОПКИ КЛАВИАТУРЫ ----
    document.addEventListener('keydown', function(e) {
        if (!loggedIn) return;
        if (e.key === 'ArrowLeft') {
            e.preventDefault();
            prevFrame();
        } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            nextFrame();
        } else if (e.key === ' ' || e.key === 'Space') {
            e.preventDefault();
            isPlaying = !isPlaying;
            if (isPlaying) {
                document.getElementById('statusText').textContent = '▶️ Воспроизведение';
                document.getElementById('statusDot').className = 'dot';
            } else {
                document.getElementById('statusText').textContent = '⏸️ Пауза';
                document.getElementById('statusDot').className = 'dot paused';
            }
        }
    });
</script>

</body>
</html>
