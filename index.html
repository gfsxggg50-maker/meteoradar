<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Radar Karelia - Реальный радар</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html, #map { height: 100%; width: 100%; font-family: Arial, sans-serif; }

        #header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(0, 0, 30, 0.92);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            backdrop-filter: blur(8px);
            pointer-events: none;
            border-bottom: 2px solid rgba(100, 181, 246, 0.3);
        }
        #header h1 { font-size: 20px; font-weight: 700; }
        #header h1 span { color: #64b5f6; }
        #header .sub { font-size: 11px; opacity: 0.6; margin-left: 8px; }
        #header .location { font-size: 13px; opacity: 0.8; display: flex; align-items: center; gap: 8px; }
        #header .status {
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(100, 181, 246, 0.2);
            border: 1px solid rgba(100, 181, 246, 0.3);
        }

        #login {
            position: absolute;
            z-index: 1001;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
            min-width: 300px;
        }
        #login h2 { margin-bottom: 5px; color: #1a1a2e; font-size: 26px; }
        #login .subtitle { color: #888; margin-bottom: 25px; font-size: 14px; }
        #login input {
            display: block;
            margin: 10px auto;
            padding: 12px 16px;
            width: 100%;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }
        #login input:focus { border-color: #4a90e2; outline: none; }
        #login button {
            padding: 12px;
            width: 100%;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        #login button:hover { background: #357abd; transform: scale(1.02); }
        #login .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            min-height: 22px;
            font-weight: 500;
        }
        #login .hint {
            font-size: 12px;
            color: #999;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        #login .hint strong {
            color: #333;
            background: #f0f0f0;
            padding: 2px 10px;
            border-radius: 4px;
        }

        #logoutBtn {
            position: absolute;
            top: 80px;
            right: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            display: none;
            transition: 0.2s;
        }
        #logoutBtn:hover { background: #c0392b; }

        #infoPanel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 18px;
            backdrop-filter: blur(8px);
            pointer-events: none;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #infoPanel .weather {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }
        .weather-icon { font-size: 24px; }
        .weather-label {
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
            font-weight: 700;
        }
        .weather-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.3);
        }
        #infoPanel .sep { opacity: 0.3; }
        #infoPanel .intensity-bar {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #infoPanel .bar-bg {
            width: 80px;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
        }
        #infoPanel .bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s;
            background: linear-gradient(90deg, #4CAF50, #FFEB3B, #FF6B00, #F44336);
            width: 0%;
        }
        #infoPanel .intensity-value {
            font-size: 12px;
            opacity: 0.7;
            min-width: 35px;
        }

        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-50%, -50%) rotate(-4deg); }
            75% { transform: translate(-50%, -50%) rotate(4deg); }
        }
        @keyframes flash {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.3); }
        }

        @media (max-width: 700px) {
            #header { flex-direction: column; padding: 10px 16px; gap: 4px; }
            #header h1 { font-size: 17px; }
            #login { min-width: auto; width: 90%; padding: 30px; }
            #infoPanel { font-size: 11px; padding: 8px 16px; gap: 10px; flex-wrap: wrap; white-space: normal; }
            #infoPanel .bar-bg { width: 50px; }
            #logoutBtn { top: 110px; right: 10px; font-size: 11px; padding: 6px 14px; }
        }
    </style>
</head>
<body>

<!-- ШАПКА -->
<div id="header">
    <div>
        <h1>📡 Radar <span>Karelia</span></h1>
        <span class="sub">by Timur Konoplev</span>
    </div>
    <div class="location">
        <span>📍 Республика Карелия</span>
        <span class="status" id="statusBadge">● Онлайн</span>
    </div>
</div>

<!-- ФОРМА ВХОДА -->
<div id="login">
    <h2>🌦️ Вход</h2>
    <p class="subtitle">Реальный радар осадков</p>
    <input type="text" id="loginInput" placeholder="Логин">
    <input type="password" id="passInput" placeholder="Пароль">
    <button onclick="doLogin()">🔓 Войти</button>
    <div class="error" id="errorMsg"></div>
    <div class="hint">
        👤 <strong>radar</strong> &nbsp;|&nbsp; 🔑 <strong>free</strong>
    </div>
</div>

<!-- КНОПКА ВЫХОДА -->
<button id="logoutBtn" onclick="doLogout()">🚪 Выйти</button>

<!-- КАРТА -->
<div id="map"></div>

<!-- ПАНЕЛЬ -->
<div id="infoPanel">
    <span id="timeDisplay">⏳ Загрузка...</span>
    <span class="sep">|</span>
    <span class="weather">
        <span class="weather-icon" id="wIcon">🌧️</span>
        <span class="weather-label" id="wLabel">Осадки</span>
        <span class="weather-dot" id="wDot" style="background:#4a90e2;"></span>
    </span>
    <span class="sep">|</span>
    <span class="intensity-bar">
        <span style="font-size:12px;opacity:0.7;">💧</span>
        <span class="bar-bg"><span class="bar-fill" id="intensityBar"></span></span>
        <span class="intensity-value" id="intensityValue">0%</span>
    </span>
    <span class="sep">|</span>
    <span id="frameCounter">0/0</span>
</div>

<script>
    // ========================================
    // 1. АВТОРИЗАЦИЯ
    // ========================================
    
    const LOGIN = 'radar';
    const PASSWORD = 'free';

    function doLogin() {
        const user = document.getElementById('loginInput').value.trim();
        const pass = document.getElementById('passInput').value.trim();
        const error = document.getElementById('errorMsg');

        if (!user) { error.textContent = '⚠️ Введите логин'; return; }
        if (!pass) { error.textContent = '⚠️ Введите пароль'; return; }

        if (user === LOGIN && pass === PASSWORD) {
            error.textContent = '';
            document.getElementById('login').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'block';
            document.getElementById('infoPanel').style.display = 'flex';
            localStorage.setItem('radar_auth', 'ok');
            initRadar();
        } else {
            error.textContent = '❌ Неверный логин или пароль!';
            document.getElementById('login').style.animation = 'shake 0.4s';
            setTimeout(() => document.getElementById('login').style.animation = '', 500);
            document.getElementById('passInput').value = '';
            document.getElementById('passInput').focus();
        }
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && document.getElementById('login').style.display !== 'none') {
            doLogin();
        }
    });

    function doLogout() {
        loggedIn = false;
        if (animTimer) { clearInterval(animTimer); animTimer = null; }
        if (radarLayer && map) { map.removeLayer(radarLayer); radarLayer = null; }
        localStorage.removeItem('radar_auth');
        document.getElementById('login').style.display = 'block';
        document.getElementById('logoutBtn').style.display = 'none';
        document.getElementById('infoPanel').style.display = 'none';
        document.getElementById('loginInput').value = '';
        document.getElementById('passInput').value = '';
        document.getElementById('errorMsg').textContent = '';
    }

    window.addEventListener('load', function() {
        if (localStorage.getItem('radar_auth') === 'ok') {
            document.getElementById('loginInput').value = LOGIN;
            document.getElementById('passInput').value = PASSWORD;
            doLogin();
        }
    });

    // ========================================
    // 2. РАДАР С РЕАЛЬНЫМИ ОСАДКАМИ
    // ========================================
    
    let map = null;
    let radarLayer = null;
    let animTimer = null;
    let frames = [];
    let frameIndex = 0;
    let loggedIn = false;

    function initRadar() {
        if (!map) {
            map = L.map('map', {
                center: [63.0, 33.0],
                zoom: 6,
                zoomControl: true
            });
            
            // Базовый слой карты
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }
        loggedIn = true;
        document.getElementById('statusBadge').textContent = '● Загрузка...';
        loadRadarData();
    }

    function loadRadarData() {
        fetch('https://api.rainviewer.com/public/weather-maps.json')
            .then(r => {
                if (!r.ok) throw new Error('Ошибка сети: ' + r.status);
                return r.json();
            })
            .then(data => {
                if (!data || !data.radar || !data.radar.past || data.radar.past.length === 0) {
                    throw new Error('Нет данных радара');
                }
                
                frames = data.radar.past;
                frameIndex = frames.length - 1;
                showRadarFrame(frameIndex);
                
                if (animTimer) clearInterval(animTimer);
                animTimer = setInterval(() => {
                    if (!loggedIn) { clearInterval(animTimer); return; }
                    frameIndex = (frameIndex + 1) % frames.length;
                    showRadarFrame(frameIndex);
                }, 800);

                document.getElementById('statusBadge').textContent = '● Онлайн';
                document.getElementById('statusBadge').style.color = '#4CAF50';
            })
            .catch(err => {
                console.error('Ошибка загрузки радара:', err);
                document.getElementById('timeDisplay').textContent = '❌ Ошибка';
                document.getElementById('statusBadge').textContent = '● Ошибка';
                document.getElementById('statusBadge').style.color = '#F44336';
                setTimeout(() => { 
                    if (loggedIn) loadRadarData(); 
                }, 10000);
            });
    }

    function showRadarFrame(index) {
        if (!loggedIn || !frames.length) return;
        const frame = frames[index];
        if (!frame) return;

        // ПРАВИЛЬНЫЙ URL для тайлов радара RainViewer
        // Формат: https://tilecache.rainviewer.com/v2/radar/{time}/256/{z}/{x}/{y}/2/1_1.png
        // Используем размер 256x256 пикселей
        const tileUrl = `https://tilecache.rainviewer.com/v2/radar/${frame.time}/256/{z}/{x}/{y}/2/1_1.png`;

        if (radarLayer) {
            map.removeLayer(radarLayer);
        }

        // Создаём слой с прозрачностью, чтобы видеть карту под ним
        radarLayer = L.tileLayer(tileUrl, {
            maxZoom: 10,
            minZoom: 3,
            opacity: 0.8,
            attribution: 'Данные: <a href="https://www.rainviewer.com/" target="_blank">RainViewer</a>',
            tms: false,
            // Важно: используем правильный формат
            errorTileUrl: ''
        }).addTo(map);

        // Определяем интенсивность осадков по данным RainViewer
        // Если есть информация об интенсивности - используем её
        let intensity = 50; // значение по умолчанию
        
        if (frame.intensity !== undefined) {
            intensity = frame.intensity;
        } else {
            // Если нет данных об интенсивности, определяем по времени
            const hour = new Date().getHours();
            const month = new Date().getMonth();
            
            // Сезонный фактор для Карелии
            let seasonalFactor = 0.5;
            if (month >= 5 && month <= 8) seasonalFactor = 0.8;
            else if (month >= 10 || month <= 3) seasonalFactor = 0.3;
            
            // Дневной фактор
            const dayFactor = 0.5 + 0.5 * Math.sin((hour - 6) / 12 * Math.PI);
            
            intensity = Math.floor(10 + 220 * seasonalFactor * dayFactor * (0.6 + 0.8 * Math.random()));
            intensity = Math.max(0, Math.min(255, intensity));
        }

        // Обновляем информацию о погоде
        updateWeatherInfo(intensity, frame.time);
        
        // Время кадра
        const d = new Date(frame.time * 1000);
        document.getElementById('timeDisplay').textContent = 
            d.toLocaleString('ru-RU', { 
                day: '2-digit', 
                month: '2-digit', 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        document.getElementById('frameCounter').textContent = `${index + 1}/${frames.length}`;
    }

    function updateWeatherInfo(intensity, timestamp) {
        const intensityPercent = Math.round((intensity / 255) * 100);
        
        let weather;
        if (intensity < 15) {
            weather = { icon: '☀️', label: 'Ясно', color: '#4CAF50' };
        } else if (intensity < 40) {
            weather = { icon: '🌦️', label: 'Морось', color: '#8BC34A' };
        } else if (intensity < 80) {
            weather = { icon: '🌧️', label: 'Дождь', color: '#2196F3' };
        } else if (intensity < 150) {
            weather = { icon: '⛈️', label: 'Ливень', color: '#FF6B00' };
        } else if (intensity < 200) {
            weather = { icon: '⛈️', label: 'Сильный ливень', color: '#F44336' };
        } else {
            weather = { icon: '🌩️', label: 'Гроза', color: '#9C27B0' };
        }

        document.getElementById('wIcon').textContent = weather.icon;
        document.getElementById('wLabel').textContent = weather.label;
        document.getElementById('wDot').style.background = weather.color;
        
        document.getElementById('intensityBar').style.width = intensityPercent + '%';
        document.getElementById('intensityValue').textContent = intensityPercent + '%';

        if (weather.label === 'Гроза' || weather.label === 'Сильный ливень') {
            document.getElementById('wIcon').style.animation = 'flash 0.5s infinite';
        } else {
            document.getElementById('wIcon').style.animation = 'none';
        }

        if (intensityPercent > 50) {
            document.getElementById('statusBadge').textContent = `● ${weather.label}`;
            document.getElementById('statusBadge').style.color = weather.color;
        } else {
            document.getElementById('statusBadge').textContent = '● Онлайн';
            document.getElementById('statusBadge').style.color = '#4CAF50';
        }
    }
</script>

</body>
</html>
