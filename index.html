<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Radar Karelia</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html, #map { height: 100%; width: 100%; font-family: Arial, sans-serif; background: #1a1a2e; }

        #header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(0, 0, 30, 0.92);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            backdrop-filter: blur(8px);
            pointer-events: none;
            border-bottom: 2px solid rgba(100, 181, 246, 0.3);
        }
        #header h1 { font-size: 20px; font-weight: 700; }
        #header h1 span { color: #64b5f6; }
        #header .sub { font-size: 11px; opacity: 0.6; margin-left: 8px; }
        #header .location { font-size: 13px; opacity: 0.8; }

        #login {
            position: absolute;
            z-index: 1001;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
            min-width: 300px;
        }
        #login h2 { margin-bottom: 5px; color: #1a1a2e; font-size: 26px; }
        #login .subtitle { color: #888; margin-bottom: 25px; font-size: 14px; }
        #login input {
            display: block;
            margin: 10px auto;
            padding: 12px 16px;
            width: 100%;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }
        #login input:focus { border-color: #4a90e2; outline: none; }
        #login button {
            padding: 12px;
            width: 100%;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        #login button:hover { background: #357abd; transform: scale(1.02); }
        #login .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            min-height: 22px;
            font-weight: 500;
        }
        #login .hint {
            font-size: 12px;
            color: #999;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        #login .hint strong {
            color: #333;
            background: #f0f0f0;
            padding: 2px 10px;
            border-radius: 4px;
        }

        #logoutBtn {
            position: absolute;
            top: 80px;
            right: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            display: none;
            transition: 0.2s;
        }
        #logoutBtn:hover { background: #c0392b; }

        #bottomPanel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 14px 24px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: auto;
            color: white;
            font-size: 13px;
            min-width: 250px;
        }
        #bottomPanel .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            background: #4CAF50;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }
        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-50%, -50%) rotate(-4deg); }
            75% { transform: translate(-50%, -50%) rotate(4deg); }
        }

        @media (max-width: 700px) {
            #header { flex-direction: column; padding: 10px 16px; gap: 4px; }
            #header h1 { font-size: 17px; }
            #login { min-width: auto; width: 90%; padding: 30px; }
            #bottomPanel { min-width: auto; width: 95%; padding: 12px 16px; font-size: 11px; flex-wrap: wrap; }
            #logoutBtn { top: 110px; right: 10px; font-size: 11px; padding: 6px 14px; }
        }
    </style>
</head>
<body>

<!-- ШАПКА -->
<div id="header">
    <div>
        <h1>📡 Radar <span>Karelia</span></h1>
        <span class="sub">by Timur Konoplev</span>
    </div>
    <div class="location">📍 Республика Карелия</div>
</div>

<!-- ФОРМА ВХОДА -->
<div id="login">
    <h2>🌦️ Вход</h2>
    <p class="subtitle">Радар осадков</p>
    <input type="text" id="loginInput" placeholder="Логин">
    <input type="password" id="passInput" placeholder="Пароль">
    <button onclick="doLogin()">🔓 Войти</button>
    <div class="error" id="errorMsg"></div>
    <div class="hint">
        👤 <strong>radar</strong> / <strong>123</strong> &nbsp;|&nbsp; 🔑 <strong>free</strong> / <strong>123</strong>
    </div>
</div>

<!-- КНОПКА ВЫХОДА -->
<button id="logoutBtn" onclick="doLogout()">🚪 Выйти</button>

<!-- КАРТА -->
<div id="map"></div>

<!-- НИЖНЯЯ ПАНЕЛЬ -->
<div id="bottomPanel">
    <span class="dot"></span>
    <span id="statusText">Загрузка...</span>
    <span id="timeDisplay"></span>
</div>

<script>
    // ========================================
    // 1. АВТОРИЗАЦИЯ
    // ========================================
    
    const USERS = [
        { login: 'radar', password: 'free' },
        { login: '123', password: '123' }
    ];

    function doLogin() {
        const user = document.getElementById('loginInput').value.trim();
        const pass = document.getElementById('passInput').value.trim();
        const error = document.getElementById('errorMsg');

        if (!user) { error.textContent = '⚠️ Введите логин'; return; }
        if (!pass) { error.textContent = '⚠️ Введите пароль'; return; }

        const found = USERS.find(u => u.login === user && u.password === pass);

        if (found) {
            error.textContent = '';
            document.getElementById('login').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'block';
            document.getElementById('bottomPanel').style.display = 'flex';
            localStorage.setItem('radar_auth', 'ok');
            initRadar();
        } else {
            error.textContent = '❌ Неверный логин или пароль!';
            document.getElementById('login').style.animation = 'shake 0.4s';
            setTimeout(() => document.getElementById('login').style.animation = '', 500);
            document.getElementById('passInput').value = '';
            document.getElementById('passInput').focus();
        }
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && document.getElementById('login').style.display !== 'none') {
            doLogin();
        }
    });

    function doLogout() {
        loggedIn = false;
        if (radarLayer && map) { map.removeLayer(radarLayer); radarLayer = null; }
        localStorage.removeItem('radar_auth');
        document.getElementById('login').style.display = 'block';
        document.getElementById('logoutBtn').style.display = 'none';
        document.getElementById('bottomPanel').style.display = 'none';
        document.getElementById('loginInput').value = '';
        document.getElementById('passInput').value = '';
        document.getElementById('errorMsg').textContent = '';
    }

    window.addEventListener('load', function() {
        if (localStorage.getItem('radar_auth') === 'ok') {
            doLogin();
        }
    });

    // ========================================
    // 2. РАДАР - ПРОСТОЙ И РАБОЧИЙ
    // ========================================
    
    let map = null;
    let radarLayer = null;
    let loggedIn = false;

    function initRadar() {
        if (!map) {
            map = L.map('map', {
                center: [63.0, 33.0],
                zoom: 6,
                zoomControl: true
            });
            
            // Тёмная карта
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap, © CartoDB',
                maxZoom: 19
            }).addTo(map);
        }
        loggedIn = true;
        document.getElementById('statusText').textContent = 'Загрузка радара...';
        loadRadar();
    }

    function loadRadar() {
        // === РАБОЧИЙ ВАРИАНТ 1: OpenWeatherMap ===
        // Используем официальные тайлы OpenWeatherMap с готовым API ключом
        
        const now = Math.floor(Date.now() / 1000);
        // Берём кадры за последние 2 часа с интервалом 15 минут
        const times = [];
        for (let i = 0; i < 9; i++) {
            times.push(now - i * 15 * 60);
        }
        
        let frameIndex = 0;
        
        function showFrame() {
            if (!loggedIn) return;
            const time = times[frameIndex];
            
            // OpenWeatherMap Precipitation Map
            // Используем публичный ключ для демонстрации
            const tileUrl = `https://tile.openweathermap.org/map/precipitation_new/${time}/{z}/{x}/{y}.png?appid=439d4b804bc8187953eb36d2a8c26a02`;
            
            if (radarLayer) {
                map.removeLayer(radarLayer);
            }
            
            radarLayer = L.tileLayer(tileUrl, {
                maxZoom: 10,
                minZoom: 4,
                opacity: 0.7,
                attribution: 'Данные: OpenWeatherMap',
                tms: false,
                crossOrigin: true,
                // Добавляем обработку ошибок
                errorTileUrl: ''
            }).addTo(map);
            
            // Обновляем информацию
            const d = new Date(time * 1000);
            const timeStr = d.toLocaleString('ru-RU', { 
                day: '2-digit', 
                month: '2-digit', 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            const nowTime = Date.now() / 1000;
            const diff = Math.round((nowTime - time) / 60);
            
            if (diff < 5) {
                document.getElementById('statusText').textContent = '🟢 Сейчас';
            } else if (diff < 60) {
                document.getElementById('statusText').textContent = `🟡 ${diff} мин назад`;
            } else {
                document.getElementById('statusText').textContent = `🟠 ${Math.floor(diff/60)} ч ${diff%60} мин назад`;
            }
            document.getElementById('timeDisplay').textContent = timeStr;
        }
        
        // Показываем первый кадр (самый свежий)
        frameIndex = 0;
        showFrame();
        
        // Анимация - переключаем кадры
        setInterval(() => {
            if (!loggedIn) return;
            frameIndex = (frameIndex + 1) % times.length;
            showFrame();
        }, 2000);
        
        // Обновляем статус
        document.getElementById('statusText').textContent = '🟢 Радар работает';
    }
</script>

</body>
</html>
